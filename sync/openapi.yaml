openapi: 3.1.0
info:
  title: Divano Sync
  version: "1"
  summary: End-to-end encrypted sync between the devices of one household.
  description: |
    A sync server stores opaque, end-to-end encrypted records for a *space* (the devices of one
    household) and hands out an ordered change feed. It never sees what the records contain: profiles,
    favorites, progress and sources are encrypted on the devices with a key the server never receives.

    The same protocol runs on the official server and on self-hosted ones: the app only needs the base
    URL. Record payloads, key derivation and pairing cryptography are specified in `README.md` next to
    this file; the server does not need to understand them.

    Conventions:
    - All bodies are JSON (`application/json`), errors are `application/problem+json` (RFC 9457).
    - Binary values (blobs, keys) are base64url without padding.
    - Times are Unix epoch milliseconds.
    - Authenticated calls send `Authorization: Bearer <device token>`. Servers store only a hash of
      the token.
servers:
  - url: https://sync.example.org
    description: Any Divano sync server; the app is configured with this base URL.

tags:
  - name: discovery
    description: What a server supports, before signing in.
  - name: space
    description: The household a device belongs to.
  - name: devices
    description: Members of the space.
  - name: pairing
    description: Adding a device to a space by scanning its QR code.
  - name: recovery
    description: Getting back into a space when no device of it is left (README, "Recovery kit").
  - name: records
    description: The encrypted change feed.

paths:
  /discovery:
    get:
      tags: [discovery]
      operationId: discover
      summary: What this server supports
      description: |
        Unauthenticated. The app calls it when the user enters a server URL and before each sync
        session. Not under /.well-known: some hosts (Vercel) reserve that path for themselves.
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }

  /v1/spaces:
    post:
      tags: [space]
      operationId: createSpace
      summary: Create a space with the calling device as its first member
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceRequest" }
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credentials" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/space:
    get:
      tags: [space]
      operationId: getSpace
      summary: Usage and limits of the caller's space
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [space]
      operationId: deleteSpace
      summary: Delete the space, its devices and all its records
      description: Irreversible. Every device token of the space stops working, and its recovery kit.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/space/recovery:
    put:
      tags: [recovery]
      operationId: setRecovery
      summary: Give the space a recovery kit, replacing the one it had
      description: |
        The server keeps a hash of `auth` and `wrapped` as they are. The previous kit stops working.
        Servers with the `recovery` feature only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRecoveryRequest" }
      responses:
        "204": { description: Kept }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [recovery]
      operationId: deleteRecovery
      summary: Remove the space's recovery kit
      description: The kit stops working. Removing a kit the space doesn't have is not an error.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/recover:
    post:
      tags: [recovery]
      operationId: recover
      summary: A new device gets into a space with its recovery kit
      description: |
        Unauthenticated: the kit is the proof. Creates a device in the space, even past
        `limits.maxDevices` (the lost devices still hold their places), and records when the kit was
        used. 404 alike for an unknown space, a space without a kit or a wrong `auth`. Servers must
        rate-limit it per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverRequest" }
      responses:
        "201":
          description: The new device's credentials and the space key, wrapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovered" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Devices of the space
      description: |
        The server knows only ids, kinds and timestamps. Device names live in encrypted `device`
        records (see README).
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device (or leave the space, when it is the caller)
      description: |
        The device's token stops working immediately. Revoking the last device deletes the space,
        unless it has a recovery kit.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/pairings:
    post:
      tags: [pairing]
      operationId: startPairing
      summary: A new device asks to join a space
      description: |
        Called by the device that wants to join (typically the TV), which then shows a QR code with
        the server URL, the `code` and the fingerprint of `publicKey`. Unauthenticated: servers must
        rate-limit it per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingRequest" }
      responses:
        "201":
          description: Pairing open until `expiresAt`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingTicket" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/pairings/{code}:
    parameters:
      - $ref: "#/components/parameters/PairingCode"
    get:
      tags: [pairing]
      operationId: getPairing
      summary: A member of a space reads a pending pairing (after scanning its QR code)
      description: |
        The caller must check that the fingerprint of `publicKey` matches the one in the QR code
        before approving; otherwise the server could substitute its own key.
      responses:
        "200":
          description: The pending pairing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingPairing" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [pairing]
      operationId: cancelPairing
      summary: The joining device gives up
      security:
        - pairingToken: []
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/pairings/{code}/approve:
    parameters:
      - $ref: "#/components/parameters/PairingCode"
    post:
      tags: [pairing]
      operationId: approvePairing
      summary: A member of a space lets the new device in
      description: |
        The server creates the new device in the caller's space, issues its token and keeps `sealed`
        (the space key encrypted for the new device) until the new device collects it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovePairingRequest" }
      responses:
        "204": { description: Approved }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/pairings/{code}/result:
    parameters:
      - $ref: "#/components/parameters/PairingCode"
    get:
      tags: [pairing]
      operationId: getPairingResult
      summary: The joining device waits for approval
      description: |
        Long-polls up to `wait` seconds. Once an `approved` result has been returned the server
        deletes the pairing: a second call gets 404.
      security:
        - pairingToken: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: Pending or approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingResult" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/records:
    get:
      tags: [records]
      operationId: pullRecords
      summary: Changes after a cursor, in order
      description: |
        Returns records whose `rev` is greater than `since`, in ascending `rev` order, at most
        `limit` of them. With no `since` the feed starts from the beginning (full sync).

        If nothing changed and `wait` is set, the server holds the request until a change arrives or
        `wait` seconds pass, then answers with an empty list and the same cursor. Servers without the
        `longpoll` feature answer immediately.

        410 `cursor_expired` means tombstones after `since` were purged: the client must do a full
        sync (no `since`).

        402 `payment_required`, here and on pushRecords, means the space's plan is suspended. The
        client keeps the space, its data and its pending changes, and asks again later.
      parameters:
        - name: since
          in: query
          schema: { $ref: "#/components/schemas/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: A page of the change feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
    post:
      tags: [records]
      operationId: pushRecords
      summary: Write records with compare-and-set
      description: |
        Each write applies only if the record's current `rev` equals `baseRev` (0 means "does not
        exist yet"). Writes are independent: some can apply while others conflict. Applied writes get
        new, increasing `rev`s in request order. For a conflict the current record is returned so the
        client can merge and retry.

        The whole request fails with 413 `quota_exceeded` if applying it would exceed the space's
        limits; nothing is applied in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
      responses:
        "200":
          description: One result per write, in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

security:
  - deviceToken: []

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Token issued by createSpace or by pairing. Opaque, at least 128 bits of entropy.
    pairingToken:
      type: apiKey
      in: header
      name: X-Pairing-Token
      description: The `pollToken` from startPairing. A header, so it stays out of access logs.

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PairingCode:
      name: code
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PairingCode" }
    Wait:
      name: wait
      in: query
      description: Seconds to hold the request open; capped at the server's `limits.maxWaitSeconds`.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Id:
      type: string
      description: Server-generated identifier, opaque to clients.
      pattern: "^[A-Za-z0-9_-]{8,64}$"

    Cursor:
      type: string
      description: Opaque position in the change feed. Clients store it and send it back unchanged.
      maxLength: 128

    PairingCode:
      type: string
      description: 8 characters of Crockford base32 (40 bits), shown in the QR code.
      pattern: "^[0-9A-HJKMNP-TV-Z]{8}$"
      examples: ["K7Q2MXH4"]

    Base64Url:
      type: string
      contentEncoding: base64url
      pattern: "^[A-Za-z0-9_-]*$"

    DeviceKind:
      type: string
      enum: [tv, phone, tablet, other]

    Discovery:
      type: object
      required: [protocols, registration, limits, features]
      properties:
        protocols:
          type: array
          description: Protocol versions served; v1 lives under `/v1`.
          items: { type: integer }
          examples: [[1]]
        registration:
          type: string
          description: |
            `open`: anyone can create a space. `secret`: createSpace needs `registrationSecret`
            (typical for self-hosted servers). `closed`: no new spaces.
          enum: [open, secret, closed]
        features:
          type: array
          description: "`longpoll`: pulls can wait for changes. `recovery`: recovery kits."
          items:
            type: string
            enum: [longpoll, recovery]
        limits: { $ref: "#/components/schemas/Limits" }
        operator:
          type: object
          description: Who runs the server, with its privacy policy and a contact.
          properties:
            name: { type: string, maxLength: 80 }
            privacyUrl: { type: string, format: uri }
            contact: { type: string, maxLength: 200 }
        service:
          type: object
          description: |
            What is about to change on this server for every space, so apps can say it ahead of time
            (README, "Notices and plans"). Absent while nothing is.
          properties:
            notice:
              type: object
              required: [kind, at]
              properties:
                kind:
                  type: string
                  description: |
                    `subscription`: from `at`, a space syncs only with a plan (`Space.plan`).
                    `closing`: the server stops on `at`. Apps ignore a kind they don't know.
                  examples: [subscription, closing]
                at: { type: integer, format: int64, description: When it happens. }
                url: { type: string, format: uri, description: A page with the details, for people. }

    Limits:
      type: object
      required: [maxRecords, maxBytes, maxBlobBytes, maxBatch, maxDevices, maxWaitSeconds, tombstoneRetentionDays]
      properties:
        maxRecords: { type: integer, description: Live records (tombstones excluded) per space. }
        maxBytes: { type: integer, description: Sum of decoded blob sizes per space. }
        maxBlobBytes: { type: integer, description: Decoded size of one blob. At least 16384. }
        maxBatch: { type: integer, description: Writes per pushRecords call. At least 100. }
        maxDevices: { type: integer }
        maxWaitSeconds: { type: integer, description: 0 when long-poll is not supported. }
        tombstoneRetentionDays:
          type: integer
          description: Tombstones older than this may be purged; at least 30.
        inactiveSpaceDays:
          type: [integer, "null"]
          description: Spaces without any request for this many days are deleted; null for never.

    CreateSpaceRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/DeviceKind" }
        registrationSecret:
          type: string
          description: "Required when discovery says `registration: secret`."
          maxLength: 256

    Credentials:
      type: object
      required: [spaceId, deviceId, token]
      properties:
        spaceId: { $ref: "#/components/schemas/Id" }
        deviceId: { $ref: "#/components/schemas/Id" }
        token:
          type: string
          description: Device token for the Authorization header. Shown only once.

    Space:
      type: object
      required: [spaceId, createdAt, usage, limits]
      properties:
        spaceId: { $ref: "#/components/schemas/Id" }
        createdAt: { type: integer, format: int64 }
        usage:
          type: object
          required: [records, bytes, devices]
          properties:
            records: { type: integer }
            bytes: { type: integer }
            devices: { type: integer }
        limits: { $ref: "#/components/schemas/Limits" }
        recovery:
          description: The space's recovery kit, null when it has none. Servers with the `recovery` feature only.
          oneOf:
            - $ref: "#/components/schemas/RecoveryInfo"
            - type: "null"
        plan:
          $ref: "#/components/schemas/Plan"
          description: The space's plan, on servers that charge for sync; absent elsewhere.

    Plan:
      type: object
      required: [status]
      description: One plan covers every device of the space.
      properties:
        status:
          type: string
          description: |
            `free`, `grandfathered`, `trial`, `active`: the space syncs. `grace`: it still syncs, the plan
            has ended and the space is suspended at `until`. `suspended`: pulls and pushes answer 402
            `payment_required`, and the space is deleted at `until`. Apps treat a status they don't know
            as one that syncs.
          examples: [trial, active, grace, suspended]
        until:
          type: [integer, "null"]
          format: int64
          description: When this status ends; null when it doesn't.
        source:
          type: string
          description: "Where the plan is managed: `play`, `stripe`, `gift`."

    RecoveryInfo:
      type: object
      required: [createdAt, usedAt]
      properties:
        createdAt: { type: integer, format: int64 }
        usedAt:
          type: [integer, "null"]
          format: int64
          description: The last recovery with this kit; null while it hasn't been used.

    RecoveryAuth:
      type: string
      description: "`HKDF(recoverySecret, \"divano-sync/1 recovery auth\")`, 32 bytes in base64url (README, \"Recovery kit\")."
      pattern: "^[A-Za-z0-9_-]{43}$"

    SetRecoveryRequest:
      type: object
      required: [auth, wrapped]
      properties:
        auth: { $ref: "#/components/schemas/RecoveryAuth" }
        wrapped:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          description: The space key, encrypted with a key only the kit gives.
          maxLength: 512

    RecoverRequest:
      type: object
      required: [spaceId, auth, kind]
      properties:
        spaceId: { $ref: "#/components/schemas/Id" }
        auth: { $ref: "#/components/schemas/RecoveryAuth" }
        kind: { $ref: "#/components/schemas/DeviceKind" }

    Recovered:
      type: object
      required: [spaceId, deviceId, token, wrapped]
      properties:
        spaceId: { $ref: "#/components/schemas/Id" }
        deviceId: { $ref: "#/components/schemas/Id" }
        token:
          type: string
          description: Device token for the Authorization header. Shown only once.
        wrapped: { $ref: "#/components/schemas/Base64Url" }

    Device:
      type: object
      required: [id, kind, createdAt, lastSeenAt, current]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        createdAt: { type: integer, format: int64 }
        lastSeenAt:
          type: integer
          format: int64
          description: Last authenticated request, rounded down to the hour.
        current:
          type: boolean
          description: True for the device making the call.

    PairingRequest:
      type: object
      required: [kind, name, publicKey]
      properties:
        kind: { $ref: "#/components/schemas/DeviceKind" }
        name:
          type: string
          description: Shown to the approver ("Approve Living room TV?"). Deleted with the pairing.
          maxLength: 60
        publicKey:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          description: Ephemeral P-256 public key, X.509 SubjectPublicKeyInfo DER.
          maxLength: 200

    PairingTicket:
      type: object
      required: [code, pollToken, expiresAt]
      properties:
        code: { $ref: "#/components/schemas/PairingCode" }
        pollToken:
          type: string
          description: Secret for getPairingResult and cancelPairing.
        expiresAt:
          type: integer
          format: int64
          description: At most 10 minutes after creation.

    PendingPairing:
      type: object
      required: [kind, name, publicKey, expiresAt]
      properties:
        kind: { $ref: "#/components/schemas/DeviceKind" }
        name: { type: string }
        publicKey: { $ref: "#/components/schemas/Base64Url" }
        expiresAt: { type: integer, format: int64 }

    Sealed:
      type: object
      description: The space key and space id, encrypted for the joining device (README, "Pairing").
      required: [ephemeralPublicKey, box]
      properties:
        ephemeralPublicKey:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          maxLength: 200
        box:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          maxLength: 2048

    ApprovePairingRequest:
      type: object
      required: [sealed]
      properties:
        sealed: { $ref: "#/components/schemas/Sealed" }

    PairingResult:
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { const: pending }
        - type: object
          required: [status, spaceId, deviceId, token, sealed]
          properties:
            status: { const: approved }
            spaceId: { $ref: "#/components/schemas/Id" }
            deviceId: { $ref: "#/components/schemas/Id" }
            token: { type: string }
            sealed: { $ref: "#/components/schemas/Sealed" }
      discriminator:
        propertyName: status

    RecordId:
      type: string
      description: |
        Chosen by clients: 22 base64url characters, the truncated HMAC of the record's collection
        and natural key (README, "Record ids"). Unique within a space.
      pattern: "^[A-Za-z0-9_-]{22}$"

    Record:
      type: object
      required: [id, rev, deleted]
      properties:
        id: { $ref: "#/components/schemas/RecordId" }
        rev:
          type: integer
          format: int64
          minimum: 0
          description: |
            Assigned by the server; strictly increasing across the whole space. 0 only in a
            `conflict`, for a record the server doesn't have (never written, or deleted and its
            tombstone purged): retry with `baseRev: 0`.
        deleted:
          type: boolean
          description: Tombstone. Tombstones have no blob.
        blob:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          description: Encrypted payload (README, "Blob format"). Present unless `deleted`.

    RecordPage:
      type: object
      required: [records, cursor, hasMore]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/Record" }
        cursor:
          allOf: [{ $ref: "#/components/schemas/Cursor" }]
          description: Pass as `since` for the next page. Store it only after applying the page.
        hasMore:
          type: boolean
          description: True when the page was cut at `limit`; fetch again right away.

    RecordWrite:
      type: object
      required: [id, baseRev]
      properties:
        id: { $ref: "#/components/schemas/RecordId" }
        baseRev:
          type: integer
          format: int64
          minimum: 0
          description: The `rev` the client last saw for this record; 0 if it has never existed.
        blob:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          description: "New payload. Exactly one of `blob` or `deleted: true`."
        deleted:
          type: boolean
          const: true

    PushRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
          description: At most `limits.maxBatch`; each id at most once.
          items: { $ref: "#/components/schemas/RecordWrite" }

    WriteResult:
      oneOf:
        - type: object
          required: [id, status, rev]
          properties:
            id: { $ref: "#/components/schemas/RecordId" }
            status: { const: applied }
            rev: { type: integer, format: int64 }
        - type: object
          required: [id, status, current]
          properties:
            id: { $ref: "#/components/schemas/RecordId" }
            status: { const: conflict }
            current: { $ref: "#/components/schemas/Record" }
      discriminator:
        propertyName: status

    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: |
            Applied writes show up again in the pull feed; the client recognises them because it
            already holds that `rev`.
          items: { $ref: "#/components/schemas/WriteResult" }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable, machine-readable reason.
          enum:
            - bad_request
            - unauthorized          # missing, unknown or revoked token
            - registration_closed
            - registration_secret_invalid
            - not_found             # also: pairing expired or already collected
            - already_approved
            - device_limit
            - quota_exceeded
            - blob_too_large
            - batch_too_large
            - cursor_expired
            - rate_limited
            - protocol_unsupported
            - payment_required      # the space's plan is suspended: pulls and pushes only
